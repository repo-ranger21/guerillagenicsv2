title = "GuerillaGenics gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders and docs"
paths = [
    '''docs/''',
    '''\.env\.example$''',
    '''CHANGELOG\.md$''',
]
regexes = [
    '''YOUR_.*_HERE''',
    '''REPLACE_WITH_.*''',
    '''\$\{.*\}''',
    '''postgres(ql)?://placeholder:placeholder@''',
]

[[rules]]
id = "odds-api-key"
description = "The Odds API key assigned to a variable"
regex = '''(?i)odds[_-]?api[_-]?key["']?\s*[:=]\s*["']?[a-f0-9]{32}\b'''
keywords = ["odds"]
tags = ["odds-api", "api-key"]

[[rules]]
id = "neon-connection-string"
description = "Neon Postgres connection string with credentials"
regex = '''postgres(?:ql)?://[^:\s/]+:[^@\s]+@[^\s/]*neon\.tech'''
keywords = ["neon.tech"]
tags = ["neon", "database", "secret"]

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token assigned to a variable"
regex = '''(?i)cloudflare[\w-]*(?:token|key)["']?\s*[:=]\s*["']?[A-Za-z0-9_\-]{40}\b'''
keywords = ["cloudflare"]
tags = ["cloudflare"]
