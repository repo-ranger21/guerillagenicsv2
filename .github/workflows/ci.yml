name: CI — Lint + Test

on:
  pull_request:
    branches: [main, develop]
  # Reusable: deploy workflows call this and only deploy if it passes.
  workflow_call:

jobs:
  backend-test:
    name: Backend — Lint + Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/ gg/ tests/

      - name: Run tests (backend + gg pipeline + formulas)
        run: pytest tests/ backend/tests/ -v --tb=short
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder_key_for_tests
          ODDS_API_KEY: placeholder_odds_key
          OPENWEATHER_API_KEY: placeholder_weather_key
          ENV: test

  frontend-test:
    name: Frontend — Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests (vitest)
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://guerillagenics-core-engine-391532873800.us-west1.run.app

  site-test:
    name: Site — Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: npm test
        working-directory: site
