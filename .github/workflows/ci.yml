name: CI — Lint + Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  engine-test:
    name: Engine — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check gg/ tests/

      - name: Run tests (gg pipeline, grading, formulas)
        run: pytest tests/ -v --tb=short
        env:
          # No test touches the network or a database; these only satisfy imports.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          ODDS_API_KEY: placeholder_odds_key

  secret-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  site-test:
    name: Site — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        run: npm test
