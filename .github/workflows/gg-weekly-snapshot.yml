name: GG Weekly Snapshot — frozen team + player stats

# Tuesday morning ET, after Monday Night Football: freeze the finished week's
# team and player stats (write-once, sha256 manifest) and commit them to the repo.
# The .xlsx workbook is attached to the run as an artifact.

on:
  schedule:
    - cron: "0 11 * * 2"   # 7:00 AM ET during EDT (6:00 AM EST)
  workflow_dispatch:
    inputs:
      week:
        description: "Week to freeze (blank = latest fully completed week)"
        required: false

permissions:
  contents: write

concurrency:
  group: gg-weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Freeze the week
        run: python -m gg.cli snapshot-week --season 2026 ${{ inputs.week && format('--week {0}', inputs.week) || '' }}

      - name: Verify every frozen week still matches its hashes
        run: python -m gg.cli snapshot-week --season 2026 --verify

      - uses: actions/upload-artifact@v4
        with:
          name: gg-snapshot-workbook
          path: snapshots/**/*.xlsx

      - name: Commit new snapshot files
        run: |
          git config user.name "gg-snapshot-bot"
          git config user.email "gg-snapshot-bot@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "data: weekly stats snapshot $(date -u +%F)"
          git push
