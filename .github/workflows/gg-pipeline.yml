name: GG Pipeline — odds, picks, grade

# The engine runs here, against Neon. Order matters:
#   odds  -> fresh lines for this week's games
#   picks -> evaluate games that have NOT kicked off (started games are locked)
#   grade -> record final scores, settle picks into pick_results
# Every step is idempotent; a failed run can simply be re-run.

on:
  schedule:
    - cron: "30 10 * * *"   # 6:30 AM ET during EDT (5:30 AM EST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but roll back (no writes survive)"
        type: boolean
        default: false

concurrency:
  group: gg-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Season gate
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from gg.season import ET, current_season_week
          try:
              season, week = current_season_week(datetime.now(ET).date())
              print("in_season=true")
              print(f"label=season {season} week {week}")
          except ValueError as exc:
              print("in_season=false")
              print(f"label={exc}")
          PY

      - name: Odds
        if: steps.gate.outputs.in_season == 'true'
        run: python -m gg.cli odds $DRY

      - name: Picks
        if: steps.gate.outputs.in_season == 'true'
        run: python -m gg.cli --current $DRY

      - name: Grade
        if: steps.gate.outputs.in_season == 'true'
        run: python -m gg.cli grade $DRY

      - name: Alert on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          curl -fsS -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"text\": \":rotating_light: GuerillaGenics pipeline FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
